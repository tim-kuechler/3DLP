[build-system]
requires = ["setuptools>=80.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3DLP"
version = "0.0.1"
description = "3D-anchored Light Probes: a real-world benchmark for lighting edits"
authors = [
  { name="Tim Küchler" },
  { name="Johann-Friedrich Feiden" },
  { name="Matthias Nießner" },
  { name="Carsten Rother" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"

dependencies = [
  "datasets",
  "numpy",
  "opencv-python-headless",
  "pandas",
  "pillow",
  "scipy",
  "tifffile",
  "tqdm",
]

[project.urls]
Homepage = "https://tim-kuechler.github.io/3DLP/"
Repository = "https://github.com/tim-kuechler/3DLP"
Dataset = "https://huggingface.co/datasets/timkuechler/3DLP"
Paper = "https://arxiv.org/abs/2606.26738"

[project.optional-dependencies]
dev = ["ruff"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["threedlp*"]
